site_name: TSSR · Mon espace de révision
site_description: Cours, travaux pratiques, glossaire et mémos de commandes pour la formation TSSR
site_author: Maqi25

site_url: https://maqi25.github.io/TSSR-COURS/
repo_url: https://github.com/Maqi25/TSSR-COURS
repo_name: Maqi25/TSSR-COURS
edit_uri: edit/main/docs/

theme:
  name: material
  language: fr
  palette:
    # Mode clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: cyan
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    # Mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  font:
    text: Roboto
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - navigation.path
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/extra.css
  - stylesheets/animations.css
  - stylesheets/home.css
  - stylesheets/theme.css

extra_javascript:
  - javascripts/theme.js
  - javascripts/icones.js
  - javascripts/filter.js
  - javascripts/quiz.js
  - javascripts/animations.js
  - javascripts/home.js
  - javascripts/calculatrice-ip.js
  - javascripts/bonhomme.js

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - footnotes
  - toc:
      permalink: true
      title: Sur cette page
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: fr


