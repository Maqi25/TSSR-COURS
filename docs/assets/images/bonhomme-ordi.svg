        <rect x="58" y="138" width="34" height="5" rx="2.5" fill="#f472b6"/><rect x="96" y="138" width="54" height="5" rx="2.5" fill="#e2e8f0"/>
        <rect x="68" y="150" width="28" height="5" rx="2.5" fill="#a78bfa"/><rect x="100" y="150" width="70" height="5" rx="2.5" fill="#22d3ee"/>
        <rect x="68" y="162" width="48" height="5" rx="2.5" fill="#fbbf24"/><rect x="120" y="162" width="40" height="5" rx="2.5" fill="#34d399"/>
        <rect x="78" y="174" width="90" height="5" rx="2.5" fill="#94a3b8"/>
        <rect x="78" y="186" width="36" height="5" rx="2.5" fill="#f472b6"/><rect x="118" y="186" width="60" height="5" rx="2.5" fill="#e2e8f0"/>
        <rect x="68" y="198" width="22" height="5" rx="2.5" fill="#a78bfa"/>
        <rect x="58" y="210" width="62" height="5" rx="2.5" fill="#22d3ee"/><rect x="124" y="210" width="44" height="5" rx="2.5" fill="#fbbf24"/>
        <rect x="68" y="222" width="80" height="5" rx="2.5" fill="#34d399"/>
      </g>
      <use href="#code" y="96"/>
    </g></g>
  </g>
  <rect class="cursor" x="38" y="234" width="8" height="8" fill="#22d3ee"/>
  <!-- reflet sur la vitre -->
  <path d="M30 130 L90 130 L50 246 L30 246 Z" fill="#fff" opacity="0.05"/>
  <circle class="led" cx="110" cy="252" r="1.8" fill="#34d399"/>
  <!-- post-it -->
  <g transform="translate(-206 -8) rotate(-10 236 128)">
    <rect x="216" y="108" width="42" height="36" rx="2" fill="#fde047"/>
    <rect x="216" y="108" width="42" height="7" fill="#facc15"/>
    <text x="237" y="130" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="8" font-weight="700" fill="#713f12">sudo</text>
    <text x="237" y="140" text-anchor="middle" font-size="8">☕</text>
  </g>

  <!-- ===== Café ===== -->
  <ellipse cx="420" cy="303" rx="22" ry="4" fill="#000" opacity="0.3"/>
  <path d="M400 262 h40 v34 q0 8 -8 8 h-24 q-8 0 -8 -8 Z" fill="url(#cup)"/>
  <ellipse cx="420" cy="262" rx="20" ry="4.5" fill="#3b2412"/>
  <ellipse cx="420" cy="262" rx="20" ry="4.5" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M440 270 q14 1 13 12 q-1 11 -13 10" fill="none" stroke="#cbd5e1" stroke-width="5"/>
  <text x="420" y="288" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="9" font-weight="900" fill="#e0267a">TSSR</text>
  <path class="steam"    d="M412 254 q-5 -7 0 -14 q5 -7 0 -14" fill="none" stroke="#e2e8f0" stroke-width="2.6" stroke-linecap="round"/>
  <path class="steam s2" d="M426 254 q-5 -7 0 -14 q5 -7 0 -14" fill="none" stroke="#e2e8f0" stroke-width="2.6" stroke-linecap="round"/>

  <!-- ===== Plante ===== -->
  <g class="sway">
    <path d="M446 292 C430 270 428 248 438 232 C444 252 448 270 446 292 Z" fill="#22c55e"/>
    <path d="M446 292 C458 272 470 262 476 246 C462 250 450 266 446 292 Z" fill="#16a34a"/>
    <path d="M446 292 C440 268 452 246 462 236 C460 258 452 276 446 292 Z" fill="#4ade80"/>
  </g>
  <path d="M432 288 h28 l-4 16 h-20 Z" fill="url(#pot)"/>

  <!-- ===== Code qui s'envole ===== -->
  <text class="sym"    x="70"  y="108" fill="#22d3ee">&lt;/&gt;</text>
  <text class="sym d1" x="160" y="104" fill="#f9a8d4">{ }</text>
  <text class="sym d2" x="118" y="110" fill="#fbbf24">$_</text>
  <text class="sym d3" x="340" y="180" fill="#a5f3fc">01</text>

  <!-- ===== Bulle ===== -->
  <g class="bubble">
    <rect x="312" y="38" width="128" height="36" rx="18" fill="#ffffff"/>
    <path d="M330 72 L322 88 L346 73 Z" fill="#ffffff"/>
    <text x="376" y="61" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-weight="700" font-size="15" fill="#c0166b">ça marche ! 🎉</text>
  </g>
</svg>
