<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 210" role="img" aria-label="Un petit bonhomme avec un casque tape sur son ordinateur, un café fume à côté">
  <style>
    .bob   { animation: bob 1.1s ease-in-out infinite; transform-box: view-box; transform-origin: 120px 104px; }
    .eyes  { animation: blink 4.2s infinite; transform-box: view-box; transform-origin: 120px 76px; }
    .hl    { animation: type 0.22s ease-in-out infinite alternate; }
    .hr    { animation: type 0.22s ease-in-out infinite alternate-reverse; }
    .steam { animation: steam 2.4s ease-out infinite; opacity: 0; }
    .s2    { animation-delay: 1.2s; }
    .sym   { animation: float 3.6s ease-out infinite; opacity: 0; font: 700 13px "JetBrains Mono", Consolas, monospace; }
    .d1 { animation-delay: 0.9s; } .d2 { animation-delay: 1.8s; } .d3 { animation-delay: 2.7s; }
    .glow  { animation: glow 2s ease-in-out infinite alternate; }
    .bubble { animation: bubble 7s ease-in-out infinite; transform-box: view-box; transform-origin: 196px 46px; opacity: 0; }
    @keyframes bob    { 50% { transform: translateY(2px) rotate(-2deg); } }
    @keyframes blink  { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(0.1); } }
    @keyframes type   { to { transform: translateY(-4px); } }
    @keyframes steam  { 0% { opacity: 0; transform: translateY(6px); } 35% { opacity: 0.85; } 100% { opacity: 0; transform: translateY(-16px); } }
    @keyframes float  { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-46px); } }
    @keyframes glow   { from { opacity: 0.35; } to { opacity: 0.75; } }
    @keyframes bubble { 0%, 62%, 100% { opacity: 0; transform: scale(0.3); } 68%, 90% { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .sym, .steam { opacity: 0.8; } .bubble { opacity: 0; } }
  </style>

  <!-- ombre et bureau -->
  <ellipse cx="120" cy="198" rx="96" ry="8" fill="#000" opacity="0.25"/>
  <rect x="14" y="160" width="212" height="10" rx="5" fill="#3b2a63"/>
  <rect x="14" y="160" width="212" height="3" rx="1.5" fill="#a855f7" opacity="0.6"/>

  <!-- bonhomme -->
  <g>
    <!-- corps (sweat à capuche) -->
    <path d="M78 162 Q76 118 120 112 Q164 118 162 162 Z" fill="#ff2e88"/>
    <path d="M110 114 Q120 126 130 114" fill="none" stroke="#c0166b" stroke-width="3" stroke-linecap="round"/>
    <!-- tête -->
    <g class="bob">
      <circle cx="120" cy="76" r="27" fill="#ffd6b0"/>
      <path d="M93 72 Q94 46 120 46 Q148 46 147 72 Q140 58 120 60 Q102 58 93 72 Z" fill="#2b1a4a"/>
      <path d="M112 50 Q118 40 126 49" fill="#2b1a4a"/>
      <g class="eyes">
        <ellipse cx="110" cy="77" rx="3.2" ry="4" fill="#1f1235"/>
        <ellipse cx="130" cy="77" rx="3.2" ry="4" fill="#1f1235"/>
      </g>
      <ellipse cx="103" cy="86" rx="4" ry="2.4" fill="#ff8fb8" opacity="0.6"/>
      <ellipse cx="137" cy="86" rx="4" ry="2.4" fill="#ff8fb8" opacity="0.6"/>
      <path d="M113 89 Q120 95 127 89" fill="none" stroke="#1f1235" stroke-width="2.4" stroke-linecap="round"/>
      <!-- casque -->
      <path d="M92 76 Q92 42 120 42 Q148 42 148 76" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
      <rect x="86" y="68" width="10" height="17" rx="5" fill="#22d3ee"/>
      <rect x="144" y="68" width="10" height="17" rx="5" fill="#22d3ee"/>
    </g>
  </g>

  <!-- reflet de l'écran sur le bonhomme -->
  <ellipse class="glow" cx="120" cy="118" rx="34" ry="12" fill="#22d3ee" opacity="0.4"/>

  <!-- ordinateur portable (vu de dos) -->
  <path d="M70 112 H170 Q174 112 174 116 V156 H66 V116 Q66 112 70 112 Z" fill="#cbd5e1"/>
  <path d="M70 112 H170 Q174 112 174 116 V120 H66 V116 Q66 112 70 112 Z" fill="#e2e8f0"/>
  <text x="120" y="142" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-weight="700" font-size="15" fill="#0891b2">&lt;/&gt;</text>
  <rect x="58" y="156" width="124" height="6" rx="3" fill="#94a3b8"/>

  <!-- mains qui tapent -->
  <circle class="hl" cx="78" cy="154" r="7" fill="#ffd6b0"/>
  <circle class="hr" cx="162" cy="154" r="7" fill="#ffd6b0"/>

  <!-- symboles de code qui s'envolent -->
  <text class="sym"    x="66"  y="104" fill="#22d3ee">&lt;/&gt;</text>
  <text class="sym d1" x="150" y="100" fill="#f9a8d4">{ }</text>
  <text class="sym d2" x="98"  y="100" fill="#fbbf24">$_</text>
  <text class="sym d3" x="136" y="106" fill="#a5f3fc">01</text>

  <!-- café qui fume -->
  <g>
    <rect x="194" y="138" width="20" height="22" rx="4" fill="#fbbf24"/>
    <path d="M214 143 Q223 145 222 151 Q221 157 214 156" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <rect x="197" y="142" width="14" height="3" rx="1.5" fill="#fff" opacity="0.5"/>
    <path class="steam"    d="M200 132 q-4 -5 0 -10 q4 -5 0 -10" fill="none" stroke="#e2e8f0" stroke-width="2.2" stroke-linecap="round"/>
    <path class="steam s2" d="M208 132 q-4 -5 0 -10 q4 -5 0 -10" fill="none" stroke="#e2e8f0" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- bulle « ça marche ! » -->
  <g class="bubble">
    <rect x="160" y="22" width="76" height="28" rx="14" fill="#ffffff"/>
    <path d="M172 48 L166 60 L182 49 Z" fill="#ffffff"/>
    <text x="198" y="41" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-weight="700" font-size="12" fill="#c0166b">ça marche ! 🎉</text>
  </g>
</svg>
