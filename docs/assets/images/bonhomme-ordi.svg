<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" class="bo-svg" role="img" aria-label="Un technicien aux yeux verts, avec un casque, tape des commandes dans un terminal, avec un café qui fume et une plante sur le bureau">
  <!--
    Bonhomme de la page d'accueil.
    Les parties avec un id « bo-… » sont animées par javascripts/bonhomme.js
    (frappe au clavier, terminal, regard, clignements, humeur, bulle).
    Sans JavaScript, l'image s'affiche quand même avec les animations CSS ci-dessous.
    Tous les noms sont préfixés « bo- » car le SVG est inséré directement dans la page.
  -->
  <defs>
    <!-- Peau : lumière chaude en haut à droite, ombre en bas -->
    <radialGradient id="bo-skin" cx="58%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffe2c8"/>
      <stop offset="0.55" stop-color="#f6c39b"/>
      <stop offset="1" stop-color="#d9946c"/>
    </radialGradient>
    <radialGradient id="bo-skinHand" cx="45%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffdcbf"/>
      <stop offset="1" stop-color="#d68f66"/>
    </radialGradient>
    <linearGradient id="bo-hair" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#6b4a32"/>
      <stop offset="0.5" stop-color="#3b2618"/>
      <stop offset="1" stop-color="#22150d"/>
    </linearGradient>
    <linearGradient id="bo-hoodie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5ca8"/>
      <stop offset="0.55" stop-color="#e0267a"/>
      <stop offset="1" stop-color="#8f1150"/>
    </linearGradient>
    <linearGradient id="bo-sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e83586"/>
      <stop offset="1" stop-color="#a3145c"/>
    </linearGradient>
    <linearGradient id="bo-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="0.5" stop-color="#4b5563"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="bo-cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.6" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="bo-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1530"/>
      <stop offset="1" stop-color="#060b1c"/>
    </linearGradient>
    <linearGradient id="bo-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c3a78"/>
      <stop offset="1" stop-color="#2d2150"/>
    </linearGradient>
    <linearGradient id="bo-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="0.5" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="bo-rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ff2e88"/>
    </linearGradient>
    <!-- Lumière bleue de l'écran sur le côté gauche du visage -->
    <linearGradient id="bo-screenLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="0.6" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bo-iris" cx="40%" cy="38%" r="70%">
      <stop offset="0" stop-color="#9ef0a8"/>
      <stop offset="0.45" stop-color="#3fb867"/>
      <stop offset="1" stop-color="#145c32"/>
    </radialGradient>
    <linearGradient id="bo-pot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#9d174d"/>
    </linearGradient>

    <filter id="bo-blur14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="bo-blur4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="bo-blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>

    <clipPath id="bo-faceClip"><path d="M223 126 C223 97 242 87 265 87 C288 87 307 97 307 126 L306 156 C304 178 288 193 265 195 C242 193 226 178 224 156 Z"/></clipPath>
    <clipPath id="bo-screenClip"><rect x="30" y="130" width="160" height="116" rx="5"/></clipPath>
    <!-- les iris et les paupières ne dépassent jamais du blanc de l'œil -->
    <clipPath id="bo-eyeClip">
      <ellipse cx="248" cy="143" rx="9" ry="8.5"/>
      <ellipse cx="283" cy="143" rx="9" ry="8.5"/>
    </clipPath>
  </defs>

  <style>
    .bo-led    { animation: bo-led 2.2s ease-in-out infinite alternate; }
    .bo-sway   { animation: bo-sway 4s ease-in-out infinite alternate; transform-box: view-box; transform-origin: 446px 292px; }
    .bo-steam  { animation: bo-steam 2.6s ease-out infinite; opacity: 0; }
    .bo-s2     { animation-delay: 1.3s; }
    .bo-blink  { animation: bo-blink 4.6s infinite; }
    .bo-cursor.is-blink { animation: bo-cursor 1s steps(1) infinite; }
    .bo-hand   { transition: transform 70ms ease-out; }
    .bo-bubble { opacity: 0; transform: scale(0.3); transform-box: view-box; transform-origin: 330px 84px;
                 transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.35), opacity 0.2s; }
    .bo-bubble.is-on { opacity: 1; transform: scale(1); }
    @keyframes bo-led    { from { opacity: 0.45; } to { opacity: 1; } }
    @keyframes bo-sway   { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
    @keyframes bo-steam  { 0% { opacity: 0; transform: translateY(8px); } 35% { opacity: 0.8; } 100% { opacity: 0; transform: translateY(-22px); } }
    @keyframes bo-blink  { 0%, 92%, 100% { transform: translateY(2px); } 95% { transform: translateY(21px); } }
    @keyframes bo-cursor { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .bo-svg * { animation: none !important; transition: none !important; } }
  </style>

  <!-- ===== Lumières d'ambiance ===== -->
  <ellipse id="bo-glow" cx="110" cy="200" rx="150" ry="110" fill="#22d3ee" opacity="0.18" filter="url(#bo-blur14)"/>
  <ellipse cx="265" cy="380" rx="210" ry="16" fill="#000" opacity="0.35" filter="url(#bo-blur4)"/>

  <!-- ===== Chaise ===== -->
  <rect x="200" y="150" width="130" height="160" rx="44" fill="#1c1433"/>
  <rect x="200" y="150" width="130" height="160" rx="44" fill="none" stroke="#a855f7" stroke-opacity="0.45" stroke-width="2"/>
  <rect x="214" y="166" width="102" height="128" rx="34" fill="#251a42"/>

  <!-- ===== Personnage (respire : bouge de haut en bas) ===== -->
  <g id="bo-body">
    <!-- buste en sweat à capuche -->
    <path d="M196 312 C192 250 212 206 265 200 C318 206 338 250 334 312 Z" fill="url(#bo-hoodie)"/>
    <path d="M232 204 Q265 236 298 204 Q292 196 265 196 Q238 196 232 204 Z" fill="#9b1456"/>
    <path d="M254 214 L251 248" stroke="#f8fafc" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M276 214 L279 248" stroke="#f8fafc" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="251" cy="250" r="2.6" fill="#e2e8f0"/><circle cx="279" cy="250" r="2.6" fill="#e2e8f0"/>
    <path d="M232 276 Q265 284 298 276 L300 300 Q265 306 230 300 Z" fill="#000" opacity="0.12"/>
    <text x="265" y="272" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-weight="700" font-size="13" fill="#fff" opacity="0.85">&lt;/&gt;</text>
    <!-- reflet bleu de l'écran sur le sweat -->
    <path d="M196 312 C192 250 212 206 265 200 L240 312 Z" fill="#22d3ee" opacity="0.1"/>

    <!-- cou -->
    <path d="M251 176 h28 v24 q-14 8 -28 0 Z" fill="#d9946c"/>

    <!-- tête : tourne vers ce qu'il regarde, petit hochement à chaque touche -->
    <g id="bo-head">
      <ellipse cx="222" cy="146" rx="8" ry="12" fill="#e8a982"/>
      <ellipse cx="308" cy="146" rx="8" ry="12" fill="#e8a982"/>
      <path d="M220 142 q3 -5 5 0" fill="none" stroke="#c07a52" stroke-width="1.5"/>
      <!-- visage, mâchoire plus carrée -->
      <path d="M223 126 C223 97 242 87 265 87 C288 87 307 97 307 126 L306 156 C304 178 288 193 265 195 C242 193 226 178 224 156 Z" fill="url(#bo-skin)"/>
      <!-- barbe de quelques jours -->
      <path d="M225 150 C228 178 245 194 265 195 C285 194 302 178 305 150 C298 168 286 178 265 180 C244 178 232 168 225 150 Z" fill="#4a3426" opacity="0.22"/>
      <path d="M250 171 Q265 165 280 171 Q278 176 265 175 Q252 176 250 171 Z" fill="#4a3426" opacity="0.2"/>
      <path d="M256 186 Q265 190 274 186 Q270 193 265 193 Q260 193 256 186 Z" fill="#4a3426" opacity="0.18"/>
      <!-- lumière de l'écran sur la joue gauche (plus forte quand l'écran s'allume) -->
      <rect id="bo-facelight" x="221" y="86" width="88" height="110" fill="url(#bo-screenLight)" clip-path="url(#bo-faceClip)" opacity="0.8"/>
      <!-- cheveux courts avec mèche relevée -->
      <path d="M222 132 C217 96 236 76 266 76 C296 76 315 94 309 132 C306 116 301 106 292 102 C276 96 252 96 238 102 C230 106 225 116 222 132 Z" fill="url(#bo-hair)"/>
      <path d="M236 98 C244 72 278 64 296 82 C284 76 264 78 250 94 Z" fill="url(#bo-hair)"/>
      <path d="M246 88 C256 74 276 72 288 80 C274 78 260 82 252 92 Z" fill="#a0764f" opacity="0.6"/>
      <path d="M222 124 L226 150 L229 150 L228 122 Z" fill="#2c1c12"/>
      <path d="M309 124 L305 150 L302 150 L303 122 Z" fill="#2c1c12"/>
      <!-- sourcils épais (montent quand il est content ou surpris) -->
      <g id="bo-brows">
        <path d="M235 125 Q247 118 260 122" fill="none" stroke="#2c1c12" stroke-width="4.6" stroke-linecap="round"/>
        <path d="M271 122 Q284 118 296 125" fill="none" stroke="#2c1c12" stroke-width="4.6" stroke-linecap="round"/>
      </g>
      <!-- yeux verts -->
      <g id="bo-eyes">
        <ellipse cx="248" cy="143" rx="9" ry="8.5" fill="#fff"/>
        <ellipse cx="283" cy="143" rx="9" ry="8.5" fill="#fff"/>
        <g clip-path="url(#bo-eyeClip)">
          <!-- iris + pupilles : se déplacent vers ce qu'il regarde -->
          <g id="bo-pupils" transform="translate(-3.5 1)">
            <circle cx="248" cy="143" r="6" fill="url(#bo-iris)" stroke="#0e3d22" stroke-width="1"/>
            <circle cx="283" cy="143" r="6" fill="url(#bo-iris)" stroke="#0e3d22" stroke-width="1"/>
            <circle cx="248" cy="143" r="2.7" fill="#06140b"/>
            <circle cx="283" cy="143" r="2.7" fill="#06140b"/>
            <circle cx="245.5" cy="140.5" r="1.8" fill="#fff"/>
            <circle cx="280.5" cy="140.5" r="1.8" fill="#fff"/>
            <circle cx="249.7" cy="145.6" r="0.9" fill="#d9f99d"/>
            <circle cx="284.7" cy="145.6" r="0.9" fill="#d9f99d"/>
          </g>
          <!-- paupières : descendent pour cligner ou plisser les yeux -->
          <g id="bo-lids" class="bo-blink" transform="translate(0 2)">
            <path d="M232 104 H300 V136 L292 136 Q283 128 274 136 L257 136 Q248 128 239 136 L232 136 Z" fill="#f1b78f"/>
            <path d="M239 136 Q248 128 257 136 M274 136 Q283 128 292 136" fill="none" stroke="#2c1c12" stroke-width="1.6"/>
          </g>
        </g>
        <path d="M238.5 138 Q248 132.5 257.5 138" fill="none" stroke="#2c1c12" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M273.5 138 Q283 132.5 292.5 138" fill="none" stroke="#2c1c12" stroke-width="2.2" stroke-linecap="round"/>
      </g>
      <!-- nez, joues, bouche (la bouche change avec l'humeur) -->
      <path d="M265 148 Q260 162 265 166 Q271 167 273 163" fill="none" stroke="#b86f48" stroke-width="2.3" stroke-linecap="round"/>
      <ellipse cx="238" cy="163" rx="6" ry="3" fill="#ff8fab" opacity="0.18"/>
      <ellipse cx="292" cy="163" rx="6" ry="3" fill="#ff8fab" opacity="0.18"/>
      <path id="bo-mouth" d="M252 176 Q265 186 278 176" fill="none" stroke="#7a2a2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="bo-dimple" d="M276 175 q3 1 4 -1" fill="none" stroke="#7a2a2a" stroke-width="2" stroke-linecap="round"/>
      <!-- casque audio -->
      <path d="M216 140 C210 66 320 66 314 140" fill="none" stroke="url(#bo-band)" stroke-width="10" stroke-linecap="round"/>
      <path d="M222 108 C236 80 294 80 308 108" fill="none" stroke="#9ca3af" stroke-width="2" opacity="0.5"/>
      <rect x="202" y="124" width="24" height="42" rx="12" fill="#111827"/>
      <rect x="304" y="124" width="24" height="42" rx="12" fill="#111827"/>
      <rect x="205" y="128" width="8" height="34" rx="4" fill="#374151"/>
      <rect class="bo-led" x="203" y="125" width="22" height="40" rx="11" fill="none" stroke="#22d3ee" stroke-width="2.4"/>
      <rect class="bo-led" x="305" y="125" width="22" height="40" rx="11" fill="none" stroke="#ff2e88" stroke-width="2.4"/>
      <!-- micro -->
      <path d="M216 160 Q222 188 246 184" fill="none" stroke="#1f2937" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="248" cy="184" r="4" fill="#111827"/>
    </g>
  </g>

  <!-- ===== Bureau ===== -->
  <path d="M26 300 H454 L474 330 H6 Z" fill="url(#bo-wood)"/>
  <path d="M26 300 H454" stroke="#c4b5fd" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="6" y="330" width="468" height="16" rx="3" fill="#1e1638"/>
  <rect x="6" y="330" width="468" height="2" fill="url(#bo-rgb)" opacity="0.7"/>

  <!-- ===== Bras ===== -->
  <path d="M214 230 C192 258 188 284 206 298" fill="none" stroke="url(#bo-sleeve)" stroke-width="28" stroke-linecap="round"/>
  <path d="M316 230 C338 258 336 284 310 298" fill="none" stroke="url(#bo-sleeve)" stroke-width="28" stroke-linecap="round"/>

  <!-- ===== Clavier rétroéclairé (les touches s'allument quand il tape) ===== -->
  <path d="M168 296 H344 L356 316 H156 Z" fill="#141022"/>
  <path d="M168 296 H344" stroke="#4b5563" stroke-width="1"/>
  <g fill="#2a2440">
    <g id="bo-row0">
      <rect x="176" y="299" width="12" height="4" rx="1"/><rect x="191" y="299" width="12" height="4" rx="1"/><rect x="206" y="299" width="12" height="4" rx="1"/><rect x="221" y="299" width="12" height="4" rx="1"/><rect x="236" y="299" width="12" height="4" rx="1"/><rect x="251" y="299" width="12" height="4" rx="1"/><rect x="266" y="299" width="12" height="4" rx="1"/><rect x="281" y="299" width="12" height="4" rx="1"/><rect x="296" y="299" width="12" height="4" rx="1"/><rect x="311" y="299" width="12" height="4" rx="1"/><rect x="326" y="299" width="12" height="4" rx="1"/>
    </g>
    <g id="bo-row1">
      <rect x="172" y="305" width="13" height="4" rx="1"/><rect x="188" y="305" width="13" height="4" rx="1"/><rect x="204" y="305" width="13" height="4" rx="1"/><rect x="220" y="305" width="13" height="4" rx="1"/><rect x="236" y="305" width="13" height="4" rx="1"/><rect x="252" y="305" width="13" height="4" rx="1"/><rect x="268" y="305" width="13" height="4" rx="1"/><rect x="284" y="305" width="13" height="4" rx="1"/><rect x="300" y="305" width="13" height="4" rx="1"/><rect x="316" y="305" width="13" height="4" rx="1"/><rect x="332" y="305" width="13" height="4" rx="1"/>
    </g>
    <rect id="bo-space" x="200" y="311" width="112" height="3.5" rx="1"/>
  </g>
  <rect x="160" y="315" width="192" height="3" rx="1.5" fill="url(#bo-rgb)" filter="url(#bo-blur2)"/>

  <!-- mains -->
  <g id="bo-handL" class="bo-hand"><ellipse cx="212" cy="296" rx="14" ry="8.5" fill="url(#bo-skinHand)"/><ellipse cx="203" cy="304" rx="3.3" ry="4.6" fill="url(#bo-skinHand)"/><ellipse cx="209" cy="304" rx="3.3" ry="4.6" fill="url(#bo-skinHand)"/><ellipse cx="215" cy="304" rx="3.3" ry="4.6" fill="url(#bo-skinHand)"/><ellipse cx="221" cy="304" rx="3.3" ry="4.6" fill="url(#bo-skinHand)"/><path d="M201 293 q11 -5 22 0" stroke="#fff" stroke-width="1.4" fill="none" opacity="0.35"/></g>
  <g id="bo-handR" class="bo-hand"><ellipse cx="304" cy="296" rx="14" ry="8.5" fill="url(#bo-skinHand)"/><ellipse cx="295" cy="304" rx="3.3" ry="4.6" fill="url(#bo-skinHand)"/><ellipse cx="301" cy="304" rx="3.3" ry="4.6" fill="url(#bo-skinHand)"/><ellipse cx="307" cy="304" rx="3.3" ry="4.6" fill="url(#bo-skinHand)"/><ellipse cx="313" cy="304" rx="3.3" ry="4.6" fill="url(#bo-skinHand)"/><path d="M293 293 q11 -5 22 0" stroke="#fff" stroke-width="1.4" fill="none" opacity="0.35"/></g>

  <!-- souris -->
  <ellipse cx="392" cy="312" rx="12" ry="7" fill="#1f1b2e"/>
  <ellipse cx="392" cy="310" rx="9" ry="4" fill="#2f2945"/>
  <circle class="bo-led" cx="392" cy="309" r="1.6" fill="#22d3ee"/>

  <!-- ===== Écran ===== -->
  <ellipse cx="110" cy="300" rx="44" ry="7" fill="#1f2937"/>
  <rect x="101" y="252" width="18" height="48" rx="3" fill="url(#bo-metal)"/>
  <rect x="18" y="118" width="184" height="140" rx="12" fill="#0f0c18"/>
  <rect x="18" y="118" width="184" height="140" rx="12" fill="none" stroke="#475569" stroke-width="1.5"/>
  <rect x="30" y="130" width="160" height="116" rx="5" fill="url(#bo-screen)"/>
  <!-- terminal : rempli lettre par lettre par bonhomme.js -->
  <g clip-path="url(#bo-screenClip)">
    <g id="bo-term" font-family="JetBrains Mono, Consolas, monospace" font-size="7">
      <text x="34" y="139"><tspan fill="#34d399">tech@srv:~$ </tspan><tspan fill="#e2e8f0">ping -c 3 192.168.1.1</tspan></text>
      <text x="34" y="148.5" fill="#94a3b8">64 octets de 192.168.1.1 : ttl=64</text>
      <text x="34" y="158" fill="#94a3b8">64 octets de 192.168.1.1 : ttl=64</text>
      <text x="34" y="167.5" fill="#94a3b8">64 octets de 192.168.1.1 : ttl=64</text>
      <text x="34" y="177" fill="#22d3ee">3 transmis, 3 reçus, 0 % perdus</text>
      <text x="34" y="186.5"><tspan fill="#34d399">tech@srv:~$ </tspan></text>
    </g>
    <rect id="bo-cursor" class="bo-cursor is-blink" x="84" y="180.5" width="4" height="7.5" fill="#22d3ee"/>
  </g>
  <!-- reflet sur la vitre -->
  <path d="M30 130 L90 130 L50 246 L30 246 Z" fill="#fff" opacity="0.05"/>
  <circle class="bo-led" cx="110" cy="252" r="1.8" fill="#34d399"/>
  <!-- post-it -->
  <g transform="translate(-206 -8) rotate(-10 236 128)">
    <rect x="216" y="108" width="42" height="36" rx="2" fill="#fde047"/>
    <rect x="216" y="108" width="42" height="7" fill="#facc15"/>
    <text x="237" y="130" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="8" font-weight="700" fill="#713f12">sudo</text>
    <text x="237" y="140" text-anchor="middle" font-size="8">☕</text>
  </g>

  <!-- ===== Café ===== -->
  <ellipse cx="420" cy="303" rx="22" ry="4" fill="#000" opacity="0.3"/>
  <path d="M400 262 h40 v34 q0 8 -8 8 h-24 q-8 0 -8 -8 Z" fill="url(#bo-cup)"/>
  <ellipse cx="420" cy="262" rx="20" ry="4.5" fill="#3b2412"/>
  <ellipse cx="420" cy="262" rx="20" ry="4.5" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M440 270 q14 1 13 12 q-1 11 -13 10" fill="none" stroke="#cbd5e1" stroke-width="5"/>
  <text x="420" y="288" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="9" font-weight="900" fill="#e0267a">TSSR</text>
  <path class="bo-steam"        d="M412 254 q-5 -7 0 -14 q5 -7 0 -14" fill="none" stroke="#e2e8f0" stroke-width="2.6" stroke-linecap="round"/>
  <path class="bo-steam bo-s2"  d="M426 254 q-5 -7 0 -14 q5 -7 0 -14" fill="none" stroke="#e2e8f0" stroke-width="2.6" stroke-linecap="round"/>

  <!-- ===== Plante ===== -->
  <g class="bo-sway">
    <path d="M446 292 C430 270 428 248 438 232 C444 252 448 270 446 292 Z" fill="#22c55e"/>
    <path d="M446 292 C458 272 470 262 476 246 C462 250 450 266 446 292 Z" fill="#16a34a"/>
    <path d="M446 292 C440 268 452 246 462 236 C460 258 452 276 446 292 Z" fill="#4ade80"/>
  </g>
  <path d="M432 288 h28 l-4 16 h-20 Z" fill="url(#bo-pot)"/>

  <!-- ===== Bulle (bonhomme.js y écrit ce qu'il dit) ===== -->
  <g id="bo-bubble" class="bo-bubble">
    <rect id="bo-bubble-bg" x="312" y="38" width="128" height="36" rx="18" fill="#ffffff"/>
    <path d="M330 72 L322 88 L346 73 Z" fill="#ffffff"/>
    <text id="bo-bubble-text" x="376" y="61" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-weight="700" font-size="14" fill="#c0166b"></text>
  </g>
</svg>
