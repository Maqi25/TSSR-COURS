<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-label="Un technicien avec un casque tape sur son clavier devant un écran plein de code, avec un café qui fume et une plante sur le bureau">
  <defs>
    <!-- Peau : lumière chaude en haut à droite, ombre en bas -->
    <radialGradient id="skin" cx="58%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffe2c8"/>
      <stop offset="0.55" stop-color="#f6c39b"/>
      <stop offset="1" stop-color="#d9946c"/>
    </radialGradient>
    <radialGradient id="skinHand" cx="45%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffdcbf"/>
      <stop offset="1" stop-color="#d68f66"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#5a3b8c"/>
      <stop offset="0.5" stop-color="#2d1b4e"/>
      <stop offset="1" stop-color="#1a0f2e"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5ca8"/>
      <stop offset="0.55" stop-color="#e0267a"/>
      <stop offset="1" stop-color="#8f1150"/>
    </linearGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e83586"/>
      <stop offset="1" stop-color="#a3145c"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="0.5" stop-color="#4b5563"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.6" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1530"/>
      <stop offset="1" stop-color="#060b1c"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c3a78"/>
      <stop offset="1" stop-color="#2d2150"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="0.5" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ff2e88"/>
    </linearGradient>
    <!-- Lumière bleue de l'écran sur le côté gauche du visage -->
    <linearGradient id="screenLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="0.6" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="iris" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#8b5a2b"/>
      <stop offset="1" stop-color="#3b2412"/>
    </radialGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#9d174d"/>
    </linearGradient>

    <filter id="blur14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>

    <clipPath id="faceClip"><ellipse cx="265" cy="140" rx="44" ry="50"/></clipPath>
    <clipPath id="screenClip"><rect x="30" y="130" width="160" height="116" rx="5"/></clipPath>
  </defs>

  <style>
    .bob    { animation: bob 1.2s ease-in-out infinite; transform-box: view-box; transform-origin: 265px 205px; }
    .blink  { animation: blink 4.6s infinite; transform-box: view-box; transform-origin: 266px 146px; }
    .typeL  { animation: type 0.19s ease-in-out infinite alternate; }
    .typeR  { animation: type 0.19s ease-in-out infinite alternate-reverse; }
    .scroll { animation: scroll 7s linear infinite; }
    .cursor { animation: cursor 0.9s steps(1) infinite; }
    .led    { animation: led 2.2s ease-in-out infinite alternate; }
    .glow   { animation: glow 3s ease-in-out infinite alternate; }
    .sway   { animation: sway 4s ease-in-out infinite alternate; transform-box: view-box; transform-origin: 446px 292px; }
    .steam  { animation: steam 2.6s ease-out infinite; opacity: 0; }
    .s2     { animation-delay: 1.3s; }
    .sym    { animation: float 4s ease-out infinite; opacity: 0; font: 700 15px "JetBrains Mono", Consolas, monospace; }
    .d1 { animation-delay: 1s; } .d2 { animation-delay: 2s; } .d3 { animation-delay: 3s; }
    .bubble { animation: bubble 8s ease-in-out infinite; transform-box: view-box; transform-origin: 360px 72px; opacity: 0; }
    @keyframes bob    { 50% { transform: translateY(1.6px) rotate(-1.4deg); } }
    @keyframes blink  { 0%, 91%, 100% { transform: scaleY(1); } 94% { transform: scaleY(0.08); } }
    @keyframes type   { to { transform: translateY(-3.5px); } }
    @keyframes scroll { to { transform: translateY(-96px); } }
    @keyframes cursor { 50% { opacity: 0; } }
    @keyframes led    { from { opacity: 0.45; } to { opacity: 1; } }
    @keyframes glow   { from { opacity: 0.5; } to { opacity: 0.85; } }
    @keyframes sway   { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
    @keyframes steam  { 0% { opacity: 0; transform: translateY(8px); } 35% { opacity: 0.8; } 100% { opacity: 0; transform: translateY(-22px); } }
    @keyframes float  { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: 0.95; } 100% { opacity: 0; transform: translateY(-60px); } }
    @keyframes bubble { 0%, 60%, 100% { opacity: 0; transform: scale(0.3); } 66%, 90% { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .bubble, .sym, .steam { opacity: 0; } }
  </style>

  <!-- ===== Lumières d'ambiance ===== -->
  <ellipse class="glow" cx="110" cy="200" rx="150" ry="110" fill="#22d3ee" opacity="0.6" filter="url(#blur14)" style="opacity:0.18"/>
  <ellipse cx="265" cy="380" rx="210" ry="16" fill="#000" opacity="0.35" filter="url(#blur4)"/>

  <!-- ===== Chaise ===== -->
  <rect x="200" y="150" width="130" height="160" rx="44" fill="#1c1433"/>
  <rect x="200" y="150" width="130" height="160" rx="44" fill="none" stroke="#a855f7" stroke-opacity="0.45" stroke-width="2"/>
  <rect x="214" y="166" width="102" height="128" rx="34" fill="#251a42"/>

  <!-- ===== Personnage ===== -->
  <!-- buste en sweat à capuche -->
  <path d="M196 312 C192 250 212 206 265 200 C318 206 338 250 334 312 Z" fill="url(#hoodie)"/>
  <path d="M232 204 Q265 236 298 204 Q292 196 265 196 Q238 196 232 204 Z" fill="#9b1456"/>
  <path d="M254 214 L251 248" stroke="#f8fafc" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M276 214 L279 248" stroke="#f8fafc" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="251" cy="250" r="2.6" fill="#e2e8f0"/><circle cx="279" cy="250" r="2.6" fill="#e2e8f0"/>
  <path d="M232 276 Q265 284 298 276 L300 300 Q265 306 230 300 Z" fill="#000" opacity="0.12"/>
  <text x="265" y="272" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-weight="700" font-size="13" fill="#fff" opacity="0.85">&lt;/&gt;</text>
  <!-- reflet bleu de l'écran sur le sweat -->
  <path d="M196 312 C192 250 212 206 265 200 L240 312 Z" fill="#22d3ee" opacity="0.1"/>

  <!-- cou -->
  <path d="M251 176 h28 v24 q-14 8 -28 0 Z" fill="#d9946c"/>

  <!-- tête (bouge légèrement au rythme de la frappe) -->
  <g class="bob">
    <ellipse cx="221" cy="146" rx="8" ry="11" fill="#e8a982"/>
    <ellipse cx="309" cy="146" rx="8" ry="11" fill="#e8a982"/>
    <ellipse cx="265" cy="140" rx="44" ry="50" fill="url(#skin)"/>
    <!-- lumière de l'écran sur la joue gauche -->
    <rect x="221" y="90" width="88" height="100" fill="url(#screenLight)" clip-path="url(#faceClip)"/>
    <!-- ombre sous les cheveux -->
    <path d="M222 128 Q265 110 308 128 Q300 118 265 112 Q230 118 222 128 Z" fill="#b8754f" opacity="0.35"/>
    <!-- cheveux -->
    <path d="M219 134 C210 84 244 66 268 68 C300 68 322 90 312 134 C306 110 290 101 270 103 C252 101 236 106 228 120 Z" fill="url(#hair)"/>
    <path d="M232 112 C240 92 262 84 284 90 C268 92 252 100 244 116 Z" fill="#7c5cbf" opacity="0.55"/>
    <path d="M262 70 C270 58 284 60 286 70" fill="none" stroke="#2d1b4e" stroke-width="5" stroke-linecap="round"/>
    <!-- sourcils -->
    <path d="M238 124 Q248 118 258 123" fill="none" stroke="#2d1b4e" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M274 123 Q284 118 294 124" fill="none" stroke="#2d1b4e" stroke-width="3.4" stroke-linecap="round"/>
    <!-- yeux (regardent l'écran, à gauche) -->
    <g class="blink">
      <ellipse cx="248" cy="146" rx="9.5" ry="10.5" fill="#fff"/>
      <ellipse cx="284" cy="146" rx="9.5" ry="10.5" fill="#fff"/>
      <circle cx="244" cy="147" r="6.4" fill="url(#iris)"/>
      <circle cx="280" cy="147" r="6.4" fill="url(#iris)"/>
      <circle cx="244" cy="147" r="3" fill="#0f0a1a"/>
      <circle cx="280" cy="147" r="3" fill="#0f0a1a"/>
      <circle cx="241.5" cy="144" r="1.9" fill="#fff"/>
      <circle cx="277.5" cy="144" r="1.9" fill="#fff"/>
      <circle cx="245.5" cy="150" r="0.9" fill="#a5f3fc"/>
      <circle cx="281.5" cy="150" r="0.9" fill="#a5f3fc"/>
      <path d="M238 139 Q248 134 258 139" fill="none" stroke="#3b2412" stroke-width="1.6" opacity="0.6"/>
      <path d="M274 139 Q284 134 294 139" fill="none" stroke="#3b2412" stroke-width="1.6" opacity="0.6"/>
    </g>
    <!-- nez, joues, sourire -->
    <path d="M264 152 Q259 164 265 167 Q270 168 272 165" fill="none" stroke="#c07a52" stroke-width="2.2" stroke-linecap="round"/>
    <ellipse cx="238" cy="166" rx="7" ry="4" fill="#ff8fab" opacity="0.45"/>
    <ellipse cx="294" cy="166" rx="7" ry="4" fill="#ff8fab" opacity="0.45"/>
    <path d="M252 176 Q264 187 278 176 Q265 181 252 176 Z" fill="#8c2f3f"/>
    <path d="M257 178.5 Q265 182 273 178.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
    <!-- casque audio -->
    <path d="M216 140 C210 66 320 66 314 140" fill="none" stroke="url(#band)" stroke-width="10" stroke-linecap="round"/>
    <path d="M222 108 C236 80 294 80 308 108" fill="none" stroke="#9ca3af" stroke-width="2" opacity="0.5"/>
    <rect x="202" y="124" width="24" height="42" rx="12" fill="#111827"/>
    <rect x="304" y="124" width="24" height="42" rx="12" fill="#111827"/>
    <rect x="205" y="128" width="8" height="34" rx="4" fill="#374151"/>
    <rect class="led" x="203" y="125" width="22" height="40" rx="11" fill="none" stroke="#22d3ee" stroke-width="2.4"/>
    <rect class="led" x="305" y="125" width="22" height="40" rx="11" fill="none" stroke="#ff2e88" stroke-width="2.4"/>
    <!-- micro -->
    <path d="M216 160 Q222 188 246 184" fill="none" stroke="#1f2937" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="248" cy="184" r="4" fill="#111827"/>
  </g>

  <!-- ===== Bureau ===== -->
  <path d="M26 300 H454 L474 330 H6 Z" fill="url(#wood)"/>
  <path d="M26 300 H454" stroke="#c4b5fd" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="6" y="330" width="468" height="16" rx="3" fill="#1e1638"/>
  <rect x="6" y="330" width="468" height="2" fill="url(#rgb)" opacity="0.7"/>

  <!-- ===== Bras et mains ===== -->
  <path d="M214 230 C192 258 188 284 206 298" fill="none" stroke="url(#sleeve)" stroke-width="28" stroke-linecap="round"/>
  <path d="M316 230 C338 258 336 284 310 298" fill="none" stroke="url(#sleeve)" stroke-width="28" stroke-linecap="round"/>

  <!-- ===== Clavier rétroéclairé ===== -->
  <path d="M168 296 H344 L356 316 H156 Z" fill="#141022"/>
  <path d="M168 296 H344" stroke="#4b5563" stroke-width="1"/>
  <g fill="#2a2440">
    <rect x="176" y="299" width="12" height="4" rx="1"/><rect x="191" y="299" width="12" height="4" rx="1"/><rect x="206" y="299" width="12" height="4" rx="1"/><rect x="221" y="299" width="12" height="4" rx="1"/><rect x="236" y="299" width="12" height="4" rx="1"/><rect x="251" y="299" width="12" height="4" rx="1"/><rect x="266" y="299" width="12" height="4" rx="1"/><rect x="281" y="299" width="12" height="4" rx="1"/><rect x="296" y="299" width="12" height="4" rx="1"/><rect x="311" y="299" width="12" height="4" rx="1"/><rect x="326" y="299" width="12" height="4" rx="1"/>
    <rect x="172" y="305" width="13" height="4" rx="1"/><rect x="188" y="305" width="13" height="4" rx="1"/><rect x="204" y="305" width="13" height="4" rx="1"/><rect x="220" y="305" width="13" height="4" rx="1"/><rect x="236" y="305" width="13" height="4" rx="1"/><rect x="252" y="305" width="13" height="4" rx="1"/><rect x="268" y="305" width="13" height="4" rx="1"/><rect x="284" y="305" width="13" height="4" rx="1"/><rect x="300" y="305" width="13" height="4" rx="1"/><rect x="316" y="305" width="13" height="4" rx="1"/><rect x="332" y="305" width="13" height="4" rx="1"/>
    <rect x="200" y="311" width="112" height="3.5" rx="1"/>
  </g>
  <rect x="160" y="315" width="192" height="3" rx="1.5" fill="url(#rgb)" filter="url(#blur2)"/>

  <!-- mains qui tapent -->
  <g class="typeL"><ellipse cx="212" cy="296" rx="14" ry="8.5" fill="url(#skinHand)"/><ellipse cx="203" cy="304" rx="3.3" ry="4.6" fill="url(#skinHand)"/><ellipse cx="209" cy="304" rx="3.3" ry="4.6" fill="url(#skinHand)"/><ellipse cx="215" cy="304" rx="3.3" ry="4.6" fill="url(#skinHand)"/><ellipse cx="221" cy="304" rx="3.3" ry="4.6" fill="url(#skinHand)"/><path d="M201 293 q11 -5 22 0" stroke="#fff" stroke-width="1.4" fill="none" opacity="0.35"/></g>
  <g class="typeR"><ellipse cx="304" cy="296" rx="14" ry="8.5" fill="url(#skinHand)"/><ellipse cx="295" cy="304" rx="3.3" ry="4.6" fill="url(#skinHand)"/><ellipse cx="301" cy="304" rx="3.3" ry="4.6" fill="url(#skinHand)"/><ellipse cx="307" cy="304" rx="3.3" ry="4.6" fill="url(#skinHand)"/><ellipse cx="313" cy="304" rx="3.3" ry="4.6" fill="url(#skinHand)"/><path d="M293 293 q11 -5 22 0" stroke="#fff" stroke-width="1.4" fill="none" opacity="0.35"/></g>

  <!-- souris -->
  <ellipse cx="392" cy="312" rx="12" ry="7" fill="#1f1b2e"/>
  <ellipse cx="392" cy="310" rx="9" ry="4" fill="#2f2945"/>
  <circle class="led" cx="392" cy="309" r="1.6" fill="#22d3ee"/>

  <!-- ===== Écran ===== -->
  <ellipse cx="110" cy="300" rx="44" ry="7" fill="#1f2937"/>
  <rect x="101" y="252" width="18" height="48" rx="3" fill="url(#metal)"/>
  <rect x="18" y="118" width="184" height="140" rx="12" fill="#0f0c18"/>
  <rect x="18" y="118" width="184" height="140" rx="12" fill="none" stroke="#475569" stroke-width="1.5"/>
  <rect x="30" y="130" width="160" height="116" rx="5" fill="url(#screen)"/>
  <!-- code qui défile -->
